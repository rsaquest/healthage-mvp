<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HealthAge — Mobile App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ha-forest:#163832; --ha-forest-2:#204A42; --ha-mint:#E7F1EA; --ha-paper:#F6F4EF;
    --ha-gold:#E3A63F; --ha-gold-dim:#F1D9A8; --ha-coral:#D6553F; --ha-coral-dim:#F6D9D2;
    --ha-ink:#182620; --ha-sage:#5F7B6D; --ha-line:#DCE2DA; --ha-white:#FFFFFF;
    --shadow: 0 10px 30px rgba(22,56,50,0.12);
  }
  [data-theme="dark"]{
    --ha-forest:#DDEFE3; --ha-forest-2:#E2F0E9; --ha-mint:#213732; --ha-paper:#111A17;
    --ha-gold:#F2C36D; --ha-gold-dim:#3E3421; --ha-coral:#FF8D75; --ha-coral-dim:#3E2223;
    --ha-ink:#F6F3E5; --ha-sage:#97A99D; --ha-line:#2B3D36; --ha-white:#182723;
    --shadow: 0 10px 30px rgba(0,0,0,0.34);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(32,74,66,0.55), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(227,166,63,0.18), transparent 50%),
      var(--ha-forest);
    font-family:'Manrope', sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    padding:36px 16px; position:relative; overflow-x:hidden;
  }
  .brandline{position:relative; z-index:1; width:100%; max-width:1000px; display:flex; flex-direction:column; align-items:center; gap:26px;}
  .brand-header{color:var(--ha-mint); text-align:center; letter-spacing:0.16em; text-transform:uppercase; font-size:12px; opacity:0.75;}
  .brand-title{color:var(--ha-white); font-family:'Fraunces', serif; font-weight:500; font-size:26px; margin:2px 0 0; text-align:center;}
  .brand-title b{color:var(--ha-gold); font-weight:600;}

  .phone{width:390px; height:844px; background:var(--ha-ink); border-radius:52px; padding:14px; box-shadow: var(--shadow); position:relative; z-index:1;}
  .phone-screen{width:100%; height:100%; background:var(--ha-paper); border-radius:38px; overflow:hidden; position:relative; display:flex; flex-direction:column;}
  .notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:26px; background:var(--ha-ink); border-radius:0 0 16px 16px; z-index:50;}
  .statusbar{display:flex; justify-content:space-between; align-items:center; padding:10px 26px 2px; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ha-ink); font-weight:500;}

  .appbar{display:flex; align-items:center; justify-content:space-between; padding:10px 18px 4px;}
  .appbar-left{display:flex; align-items:center; gap:9px;}
  .appbar-back{border:none; background:rgba(22,56,50,0.08); color:var(--ha-forest); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .logo-dot{width:26px;height:26px;border-radius:50%;background:var(--ha-forest);display:flex;align-items:center;justify-content:center;}
  .logo-dot svg{width:15px;height:15px;}
  .appbar-name{font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:var(--ha-forest);}
  .sos-chip{display:flex; align-items:center; gap:5px; background:var(--ha-coral); color:white; border:none; font-family:'Manrope'; font-weight:700; font-size:11.5px; letter-spacing:0.03em; padding:7px 12px; border-radius:100px; cursor:pointer; box-shadow:0 4px 10px rgba(214,85,63,0.35); animation: sospulse 2.2s infinite;}
  @keyframes sospulse{0%,100%{box-shadow:0 4px 10px rgba(214,85,63,0.35);} 50%{box-shadow:0 4px 18px rgba(214,85,63,0.6);}}
  .duty-chip{display:flex; align-items:center; gap:6px; border:none; font-family:'Manrope'; font-weight:700; font-size:11.5px; padding:7px 12px; border-radius:100px; cursor:pointer;}
  .duty-chip.on{background:var(--ha-forest); color:white;}
  .duty-chip.off{background:var(--ha-line); color:var(--ha-sage);}
  .duty-dot{width:7px;height:7px;border-radius:50%;background:var(--ha-gold);}
  .duty-chip.on .duty-dot{animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .screen-body{flex:1; overflow-y:auto; padding:6px 18px 100px; scrollbar-width:none;}
  .screen-body::-webkit-scrollbar{display:none;}
  h1,h2,h3,p{margin:0;}
  .eyebrow{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ha-sage); font-weight:700;}
  .section-title{font-family:'Fraunces',serif; font-size:19px; color:var(--ha-ink); font-weight:600; margin:2px 0 12px;}
  .muted{color:var(--ha-sage); font-size:13px;}

  .card{background:var(--ha-white); border:1px solid var(--ha-line); border-radius:18px; padding:16px; box-shadow:0 2px 10px rgba(22,56,50,0.05);}
  .card + .card{margin-top:12px;}
  .notice-card{background:linear-gradient(135deg, rgba(227,166,63,0.16), rgba(231,241,234,0.95)); border-color:rgba(227,166,63,0.25);} 
  .pill-chip{display:inline-flex; align-items:center; gap:6px; background:rgba(22,56,50,0.08); color:var(--ha-forest); padding:5px 8px; border-radius:999px; font-size:10.5px; font-weight:700; margin-top:8px;}
  .greeting-card::after{content:""; position:absolute; right:-30px; top:-30px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle, rgba(227,166,63,0.35), transparent 70%);}
  .greeting-hi{font-family:'Fraunces',serif; font-size:22px; font-weight:500; position:relative; z-index:1;}
  .greeting-sub{font-size:12.5px; opacity:0.85; margin-top:4px; position:relative; z-index:1;}
  .role-toggle{margin-top:14px; display:inline-flex; background:rgba(255,255,255,0.12); border-radius:100px; padding:3px; position:relative; z-index:1;}
  .role-toggle button{border:none; background:transparent; color:var(--ha-mint); font-family:'Manrope'; font-weight:700; font-size:11px; padding:6px 12px; border-radius:100px; cursor:pointer; opacity:0.65;}
  .role-toggle button.active{background:var(--ha-gold); color:var(--ha-forest); opacity:1;}
  .stat-row{display:flex; gap:10px; margin-top:14px;}
  .stat-pill{flex:1; background:rgba(255,255,255,0.1); border-radius:14px; padding:10px 12px; position:relative; z-index:1;}
  .stat-pill .num{font-family:'IBM Plex Mono'; font-size:16px; font-weight:500;}
  .stat-pill .lbl{font-size:10.5px; opacity:0.75; margin-top:2px;}

  .qa-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px;}
  .qa-item{display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;}
  .qa-icon{width:52px; height:52px; border-radius:16px; background:var(--ha-mint); display:flex; align-items:center; justify-content:center; border:1px solid var(--ha-line); transition:transform .15s ease;}
  .qa-item:active .qa-icon{transform:scale(0.92);}
  .qa-icon svg{width:22px;height:22px; stroke:var(--ha-forest);}
  .qa-label{font-size:10.5px; font-weight:600; color:var(--ha-ink); text-align:center; line-height:1.2;}

  .visit-row{display:flex; gap:12px; align-items:center;}
  .avatar{width:46px; height:46px; border-radius:14px; background:var(--ha-gold-dim); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; color:var(--ha-forest); font-size:16px; flex-shrink:0;}
  .visit-info{flex:1;}
  .visit-title{font-weight:700; font-size:13.5px; color:var(--ha-ink);}
  .visit-sub{font-size:12px; color:var(--ha-sage); margin-top:2px;}
  .eta-badge{font-family:'IBM Plex Mono'; font-size:11px; background:var(--ha-mint); color:var(--ha-forest); padding:5px 9px; border-radius:8px; font-weight:600;}
  .status-badge{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:8px;}
  .status-matched{background:var(--ha-mint); color:var(--ha-forest);}
  .status-enroute{background:var(--ha-gold-dim); color:#7A5412;}
  .status-progress{background:var(--ha-coral-dim); color:var(--ha-coral);}
  .status-done{background:#DCEEE1; color:#1F7A44;}

  .btn{border:none; border-radius:14px; padding:12px 16px; font-family:'Manrope'; font-weight:700; font-size:13.5px; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary{background:var(--ha-forest); color:white;}
  .btn-gold{background:var(--ha-gold); color:var(--ha-forest);}
  .btn-outline{background:transparent; color:var(--ha-forest); border:1.5px solid var(--ha-forest);}
  .btn-coral{background:var(--ha-coral); color:white;}
  .btn-half{width:auto; flex:1;}
  .btn-row{display:flex; gap:10px; margin-top:14px;}

  .bottomnav{position:absolute; bottom:0; left:0; right:0; background:var(--ha-white); border-top:1px solid var(--ha-line); display:flex; padding:10px 6px 16px; z-index:20;}
  .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; color:var(--ha-sage);}
  .nav-item svg{width:20px; height:20px; stroke:var(--ha-sage);}
  .nav-item.active{color:var(--ha-forest);}
  .nav-item.active svg{stroke:var(--ha-forest);}
  .nav-item span{font-size:9.5px; font-weight:700;}

  .svc-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .svc-card{background:white; border:1px solid var(--ha-line); border-radius:16px; padding:14px; cursor:pointer; transition:transform .12s ease;}
  .svc-card:active{transform:scale(0.96);}
  .svc-card.emergency{background:var(--ha-coral-dim); border-color:var(--ha-coral);}
  .svc-icon{width:38px;height:38px; border-radius:11px; background:var(--ha-mint); display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
  .svc-icon svg{width:19px;height:19px; stroke:var(--ha-forest);}
  .svc-card.emergency .svc-icon{background:white;}
  .svc-card.emergency .svc-icon svg{stroke:var(--ha-coral);}
  .svc-name{font-weight:700; font-size:13px; color:var(--ha-ink);}
  .svc-desc{font-size:11px; color:var(--ha-sage); margin-top:3px; line-height:1.3;}

  .tl-filters{display:flex; gap:8px; margin:10px 0 16px; flex-wrap:wrap;}
  .tl-filter{padding:6px 12px; border-radius:100px; font-size:11.5px; font-weight:700; border:1px solid var(--ha-line); background:white; color:var(--ha-sage); cursor:pointer;}
  .tl-filter.active{background:var(--ha-forest); color:white; border-color:var(--ha-forest);}
  .tl-wrap{position:relative; padding-left:26px;}
  .tl-line{position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--ha-gold), var(--ha-forest));}
  .tl-item{position:relative; margin-bottom:18px;}
  .tl-dot{position:absolute; left:-26px; top:4px; width:14px; height:14px; border-radius:50%; background:var(--ha-white); border:3px solid var(--ha-forest);}
  .tl-item.emergency .tl-dot{border-color:var(--ha-coral);}
  .tl-item.medication .tl-dot{border-color:var(--ha-gold);}
  .tl-date{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--ha-sage); margin-bottom:4px;}
  .tl-vitals{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .tl-vital{font-family:'IBM Plex Mono'; font-size:10.5px; background:var(--ha-mint); color:var(--ha-forest); padding:3px 8px; border-radius:7px;}

  .med-row{display:flex; align-items:center; gap:12px;}
  .med-icon{width:40px;height:40px;border-radius:12px;background:var(--ha-mint); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .med-icon svg{width:18px;height:18px; stroke:var(--ha-forest);}
  .toggle{width:38px; height:22px; border-radius:100px; background:var(--ha-line); position:relative; cursor:pointer; flex-shrink:0;}
  .toggle.on{background:var(--ha-forest);}
  .toggle-dot{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:white; transition:left .15s ease;}
  .toggle.on .toggle-dot{left:18px;}
  .progress-track{height:6px; background:var(--ha-line); border-radius:100px; margin-top:8px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--ha-gold); border-radius:100px;}

  .report-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .report-stat{background:var(--ha-mint); border-radius:14px; padding:12px; text-align:center;}
  .report-stat .n{font-family:'IBM Plex Mono'; font-size:20px; font-weight:600; color:var(--ha-forest);}
  .report-stat .l{font-size:10.5px; color:var(--ha-sage); margin-top:2px;}
  .spend-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--ha-line); font-size:12.5px;}
  .spend-row:last-child{border-bottom:none;}
  .earn-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--ha-line); font-size:12.5px;}
  .earn-row:last-child{border-bottom:none;}
  .earn-bar-track{width:70px; height:6px; background:var(--ha-mint); border-radius:100px; overflow:hidden;}
  .earn-bar-fill{height:100%; background:var(--ha-forest);}
  .rating-stars{color:var(--ha-gold); font-size:14px; letter-spacing:1px;}
  .cert-chip{display:inline-flex; align-items:center; gap:5px; background:var(--ha-mint); color:var(--ha-forest); font-size:11px; font-weight:700; padding:5px 10px; border-radius:100px; margin:3px 4px 3px 0;}
  .vital-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .req-timer{width:44px;height:44px;border-radius:50%; border:3px solid var(--ha-gold); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-weight:600; font-size:15px; color:var(--ha-forest); flex-shrink:0;}
  .map-mock{background:linear-gradient(135deg,#DCE7DF,#C7D9CD); border-radius:16px; height:150px; position:relative; overflow:hidden; margin-top:12px;}
  .map-mock svg{position:absolute; inset:0; width:100%; height:100%;}
  .map-pin{position:absolute; width:14px;height:14px;border-radius:50%; background:var(--ha-coral); border:3px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.25);}

  .field-label{font-size:11.5px; font-weight:700; color:var(--ha-sage); margin:14px 0 6px; text-transform:uppercase; letter-spacing:0.05em;}
  .field{background:white; border:1px solid var(--ha-line); border-radius:12px; padding:11px 13px; font-family:'Manrope'; font-size:13.5px; width:100%;}
  textarea.field{resize:none; height:64px; font-family:'Manrope';}

  .radar{width:120px; height:120px; border-radius:50%; margin:14px auto; position:relative; display:flex; align-items:center; justify-content:center; background:var(--ha-mint);}
  .radar-ring{position:absolute; border-radius:50%; border:2px solid var(--ha-forest); opacity:0; animation:radarpulse 2.4s infinite;}
  .radar-ring:nth-child(1){width:100%; height:100%; animation-delay:0s;}
  .radar-ring:nth-child(2){width:100%; height:100%; animation-delay:0.8s;}
  .radar-ring:nth-child(3){width:100%; height:100%; animation-delay:1.6s;}
  @keyframes radarpulse{0%{transform:scale(0.5); opacity:0.7;} 100%{transform:scale(1.3); opacity:0;}}
  .radar-core{width:44px;height:44px; border-radius:50%; background:var(--ha-forest); display:flex; align-items:center; justify-content:center; z-index:2;}
  .radar-core svg{width:22px;height:22px; stroke:white;}
  .step-list{margin-top:10px;}
  .step-row{display:flex; align-items:center; gap:10px; padding:9px 0; opacity:0.25; transition:opacity .3s ease;}
  .step-row.active{opacity:1;}
  .step-dot{width:20px;height:20px; border-radius:50%; background:var(--ha-mint); border:2px solid var(--ha-forest); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .step-row.active .step-dot{background:var(--ha-forest);}
  .step-dot svg{width:11px;height:11px; stroke:white;}
  .step-text{font-size:12.5px; font-weight:600; color:var(--ha-ink);}
  .theme-toggle{border:none; border-radius:999px; background:rgba(255,255,255,0.16); color:var(--ha-ink); padding:7px 10px; cursor:pointer; font-size:12px;}
  .status-track{background:linear-gradient(135deg, rgba(227,166,63,0.12), rgba(231,241,234,0.7)); border:1px solid rgba(227,166,63,0.18);} 
  .status-steps{display:grid; gap:8px; margin-top:10px;}
  .status-step{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ha-sage);}
  .status-step .dot{width:8px; height:8px; border-radius:50%; background:var(--ha-line);} 
  .status-step.active .dot{background:var(--ha-gold);} 
  .status-step.done .dot{background:var(--ha-forest);} 
  .status-step strong{color:var(--ha-ink);} 
  .match-progress{height:8px; background:var(--ha-line); border-radius:999px; overflow:hidden; margin:12px 0 10px;}
  .match-progress > div{height:100%; background:linear-gradient(90deg, var(--ha-gold), var(--ha-forest)); transition:width .25s ease;} 
  .admin-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
  .admin-card{background:var(--ha-white); border:1px solid var(--ha-line); border-radius:16px; padding:14px;}
  .admin-card .n{font-family:'IBM Plex Mono'; font-size:18px; font-weight:700; color:var(--ha-forest);} 
  .admin-card .l{font-size:10.5px; color:var(--ha-sage); margin-top:4px;}

  .overlay{position:absolute; inset:0; background:rgba(22,38,32,0.55); z-index:60; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{background:var(--ha-paper); width:100%; border-radius:26px 26px 0 0; padding:20px 20px 26px; max-height:88%; overflow-y:auto; transform:translateY(30px); transition:transform .25s ease; position:relative;}
  .overlay.show .sheet{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--ha-line); border-radius:100px; margin:0 auto 14px;}
  .sheet-close{position:absolute; top:16px; right:16px; background:white; border:1px solid var(--ha-line); border-radius:50%; width:30px;height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer;}

  .video-mock{background:linear-gradient(135deg,#1B2E27,#0E1B17); border-radius:18px; height:220px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; color:white;}
  .video-self{position:absolute; bottom:10px; right:10px; width:70px; height:96px; background:#2A3F37; border-radius:10px; border:2px solid rgba(255,255,255,0.3);}
  .call-controls{display:flex; gap:12px; justify-content:center; margin-top:14px;}
  .call-btn{width:46px;height:46px; border-radius:50%; background:white; border:1px solid var(--ha-line); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .call-btn svg{width:19px;height:19px; stroke:var(--ha-forest);}
  .call-btn.end{background:var(--ha-coral);}
  .call-btn.end svg{stroke:white;}

  .toast{position:absolute; top:66px; left:18px; right:18px; background:var(--ha-forest); color:white; padding:11px 14px; border-radius:12px; font-size:12.5px; font-weight:600; z-index:80; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); transform:translateY(-20px); opacity:0; transition:all .25s ease;}
  .toast.show{transform:translateY(0); opacity:1;}

  /* Landing / auth */
  .landing{padding:40px 22px; display:flex; flex-direction:column; height:100%;}
  .landing-logo{width:64px; height:64px; border-radius:22px; background:var(--ha-forest); display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
  .landing-logo svg{width:34px;height:34px;}
  .landing-title{font-family:'Fraunces',serif; font-weight:600; font-size:24px; text-align:center; color:var(--ha-ink);}
  .landing-sub{font-size:13px; color:var(--ha-sage); text-align:center; margin-top:8px; line-height:1.5;}
  .role-card{display:flex; align-items:center; gap:14px; background:white; border:1.5px solid var(--ha-line); border-radius:18px; padding:16px; margin-top:14px; cursor:pointer; transition:transform .12s ease, border-color .12s ease;}
  .role-card:active{transform:scale(0.97);}
  .role-card:hover{border-color:var(--ha-forest);}
  .role-card .qa-icon{width:46px;height:46px;}
  .role-card-title{font-weight:700; font-size:14px; color:var(--ha-ink);}
  .role-card-desc{font-size:11.5px; color:var(--ha-sage); margin-top:2px;}
  .landing-foot{margin-top:auto; text-align:center; font-size:11px; color:var(--ha-sage);}

  /* Auth (sign in / register) */
  .auth-wrap{padding:26px 22px 34px;}
  .auth-back{display:inline-flex; align-items:center; gap:6px; color:var(--ha-sage); font-weight:700; font-size:12.5px; cursor:pointer; margin-bottom:16px;}
  .auth-back svg{width:16px;height:16px; stroke:var(--ha-sage);}
  .auth-icon{width:50px;height:50px;border-radius:16px; background:var(--ha-forest); display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .auth-icon svg{width:24px;height:24px;}

<script>
/* ================================================================

   ================================================================ */
const ICONS = {

  pill:'<path d="M4.5 15.5l7-7a4.95 4.95 0 1 1 7 7l-7 7a4.95 4.95 0 0 1-7-7z"/><path d="M8.5 8.5l7 7"/>',

  end:'<path d="M22 16.9v2a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 1h2a2 2 0 0 1 2 1.7c.1 1.1.4 2.1.7 3.1a2 2 0 0 1-.5 2.1L7 9.3a16 16 0 0 0 6 6l1.4-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .6 3.1.7A2 2 0 0 1 22 16.9z"/>',
  gps:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  wallet:'<path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7z"/><path d="M16 13h3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',
  badge:'<circle cx="12" cy="9" r="6"/><path d="M9 14l-2 7 5-3 5 3-2-7"/>',
  arrowleft:'<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>'

function icon(name, extra=""){ return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[name]||""}</svg>`; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function openSheet(html){ document.getElementById('sheet').innerHTML = html; document.getElementById('overlay').classList.add('show'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }

/* ================================================================
   APP-LEVEL STATE  (mode: 'landing' | 'patient' | 'practitioner')
   ================================================================ */
const state = { mode:"landing" };
const authState = { role:null, mode:"signin", patientSubRole:"patient" };
const uiState = { theme:"light" };
const sessionState = { user:null };

function loadAccounts(){
  try { return JSON.parse(localStorage.getItem('healthage_accounts')) || []; } catch(e){ return []; }
}
function saveAccounts(accounts){ localStorage.setItem('healthage_accounts', JSON.stringify(accounts)); }
function seedAccounts(){
  const defaults = [
    { id:'patient-demo', name:'Amara Okoye', role:'patient', subRole:'patient', email:'amara.okoye@email.com', password:'password123' },
    { id:'family-demo', name:'Tobenna Okoye', role:'patient', subRole:'family', email:'tobenna.okoye@email.com', password:'password123' },
    { id:'practitioner-demo', name:'Blessing Eze', role:'practitioner', email:'blessing.eze@email.com', password:'password123' },
    { id:'admin-demo', name:'Ada Okafor', role:'admin', email:'admin@healthage.com', password:'admin123' }
  ];
  if (!loadAccounts().length) {
    saveAccounts(defaults);
  }
}
const accountStore = loadAccounts();
if (!accountStore.length) { seedAccounts(); }
const accounts = loadAccounts();

function applyTheme(){ document.body.dataset.theme = uiState.theme; }
function toggleTheme(){
  uiState.theme = uiState.theme==='light' ? 'dark' : 'light';
  applyTheme();
  render();
  toast(uiState.theme==='dark' ? 'Dark mode enabled' : 'Light mode enabled');
}

function goApp(mode){
  state.mode = mode;
  if(mode==='patient'){ pState.tab='home'; }
  if(mode==='practitioner'){ prState.tab='home'; }
  if(mode==='admin'){ state.mode='admin'; }
  render();
}
function backToLanding(){
  closeSheet();
  state.mode='landing';
  render();
}
function goBack(){
  if (state.mode === 'auth') {
    backToLanding();
  } else if (state.mode === 'patient' || state.mode === 'practitioner' || state.mode === 'admin') {
    logout();
  } else {
    backToLanding();
  }
}
function logout(){
  sessionState.user = null;
  closeSheet();
  state.mode='landing';
  render();
  toast('Signed out');
}
function goAdmin(){
  closeSheet();
  if (sessionState.user && sessionState.user.role === 'admin') {
    state.mode='admin';
    render();
    return;
  }
  toast('Please sign in as an admin to open the dashboard.');
  showAuth('admin');
}
function showAuth(role){
  authState.role = role;
  authState.mode = 'signin';
  authState.patientSubRole = 'patient';
  state.mode = 'auth';
  render();
}
function setAuthMode(m){ authState.mode = m; render(); }
function setPatientSubRole(r){ authState.patientSubRole = r; render(); }
function submitAuth(){
  const role = authState.role;
  const email = document.getElementById('authEmail')?.value?.trim() || '';
  const password = document.getElementById('authPassword')?.value || '';
  const confirm = document.getElementById('authConfirm')?.value || '';
  const name = document.getElementById('authName')?.value?.trim() || '';

  if (!email) {
    toast('Please enter an email or phone number.');
    return;
  }
  if (password.length < 6) {
    toast('Password must be at least 6 characters.');
    return;
  }
  if (authState.mode === 'register' && confirm !== password) {
    toast('Passwords do not match.');
    return;
  }

  const accounts = loadAccounts();
  const existing = accounts.find(a => a.email.toLowerCase() === email.toLowerCase());
  if (authState.mode === 'signin') {
    const user = accounts.find(a => a.email.toLowerCase() === email.toLowerCase() && a.password === password && a.role === role);
    if (!user) {
      toast('No matching '+role+' account was found. Try creating one first.');
      return;
    }
    sessionState.user = user;
    if(role==='patient'){ pState.role = user.subRole || authState.patientSubRole; }
    goApp(role);
    toast('Signed in successfully as '+(role==='patient' ? (pState.role==='family'?'Family':'Patient') : role === 'admin' ? 'Admin' : 'Practitioner'));
    return;
  }

  if (existing) {
    toast('An account with that email already exists. Please sign in instead.');
    return;
  }

  const newUser = { id: (role+'-'+Date.now()), name: name || (role==='admin' ? 'Admin User' : role==='practitioner' ? 'New Practitioner' : 'New Patient'), role, subRole: role==='patient' ? authState.patientSubRole : undefined, email, password };
  accounts.push(newUser);
  saveAccounts(accounts);
  sessionState.user = newUser;
  if(role==='patient'){ pState.role = newUser.subRole || authState.patientSubRole; }
  goApp(role);
  toast('Account created successfully');
}

function render(){
  applyTheme();
  const appbar = document.getElementById('appbar');
  const nav = document.getElementById('bottomNav');
  if(state.mode==='landing'){
    appbar.style.display='none'; nav.style.display='none';
    document.getElementById('statusRight').textContent = '●●●● HealthAge';
    document.getElementById('screenBody').innerHTML = screenLanding();
    document.getElementById('screenBody').style.padding = '0';
  } else if(state.mode==='auth'){
    appbar.style.display='none'; nav.style.display='none';
    document.getElementById('statusRight').textContent = '●●●● HealthAge';
    document.getElementById('screenBody').innerHTML = screenAuth();
    document.getElementById('screenBody').style.padding = '0';
  } else if(state.mode==='patient'){
    document.getElementById('screenBody').style.padding = '6px 18px 100px';
    appbar.style.display='flex'; nav.style.display='flex';
    document.getElementById('statusRight').textContent = '●●●● HealthAge';
    renderPatientAppbar();
    renderPatientScreen();
  } else if(state.mode==='practitioner'){
    document.getElementById('screenBody').style.padding = '6px 18px 100px';
    appbar.style.display='flex'; nav.style.display='flex';
    document.getElementById('statusRight').textContent = '●●●● HealthAge Pro';
    renderProAppbar();
    renderProScreen();
  } else if(state.mode==='admin'){
    document.getElementById('screenBody').style.padding = '6px 18px 100px';
    appbar.style.display='flex'; nav.style.display='none';
    document.getElementById('statusRight').textContent = '●●●● Admin';
    renderAdminAppbar();
    document.getElementById('screenBody').innerHTML = screenAdmin();
  }
}

function screenLanding(){
  return `
    <div class="landing">
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
        <div class="landing-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#E7F1EA" stroke-width="2"><path d="M12 21s-7-4.6-9.3-9C1 8.7 2.6 5 6.2 5c2 0 3.3 1.1 3.8 2C10.5 6.1 11.8 5 13.8 5 17.4 5 19 8.7 17.3 12 15 16.4 12 21 12 21z"/></svg></div>

            <div class="muted" style="margin-top:4px;">Sign in with admin credentials to open the dashboard.</div>
          </div>
        </div>
      </div>
      <div class="landing-foot">HealthAge Mobile App · MVP Prototype</div>
    </div>
  `;
}

function screenAuth(){
  const role = authState.role;
  const isPatient = role==='patient';
  const signin = authState.mode==='signin';
  const roleTitle = isPatient? 'Patient & Family Access' : 'Practitioner Access';
  const roleIcon = isPatient? 'heart' : 'briefcase';

  const patientSubRolePicker = isPatient ? `
    <div class="field-label">Continue as</div>
    <div class="tl-filters" style="margin:0 0 4px;">
      <div class="tl-filter ${authState.patientSubRole==='patient'?'active':''}" onclick="setPatientSubRole('patient')">Patient</div>
      <div class="tl-filter ${authState.patientSubRole==='family'?'active':''}" onclick="setPatientSubRole('family')">Family / Observer</div>
    </div>
  ` : "";

  const practitionerFields = !isPatient ? `
    <div class="field-label">Specialization</div>
    <input class="field" placeholder="e.g. Registered Nurse, Physiotherapist" value="${signin?'':'Registered Nurse'}">
    <div class="field-label">License number</div>
    <input class="field" placeholder="e.g. RN-88213" value="${signin?'':''}">
    <div class="field-label">License document</div>
    <div class="card" style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; cursor:pointer;" onclick="toast('License document attached (demo)')">
      <span class="muted">Upload for verification</span>
      <button class="btn btn-outline" style="width:auto; padding:6px 12px; font-size:11px;" type="button">Upload</button>
    </div>
  ` : "";

  return `
    <div class="auth-wrap">
      <div class="auth-back" onclick="backToLanding()">${icon('arrowleft')} Back</div>
      <div class="auth-icon">${icon(roleIcon,'style="stroke:#E7F1EA"')}</div>
      <p class="landing-title" style="text-align:left; font-size:20px;">${roleTitle}</p>
      <p class="landing-sub" style="text-align:left; margin-top:6px;">${signin? 'Sign in to continue to your account.' : 'Create an account to get started.'}</p>

      <div class="auth-tabs">
        <div class="auth-tab ${signin?'active':''}" onclick="setAuthMode('signin')">Sign In</div>
        <div class="auth-tab ${!signin?'active':''}" onclick="setAuthMode('register')">Create Account</div>
      </div>

      ${!signin? `
        <div class="field-label">Full name</div>
        <input class="field" id="authName" placeholder="e.g. ${isPatient?'Amara Okoye':'Blessing Eze'}">
      `:``}

      <div class="field-label">Email or phone number</div>
      <input class="field" id="authEmail" placeholder="you@email.com" value="${signin? (isPatient?'amara.okoye@email.com':'blessing.eze@email.com') : ''}">

      <div class="field-label">Password</div>
      <input class="field" id="authPassword" type="password" placeholder="${signin?'••••••••':'Create a password'}" value="${signin?'password123':''}">

      ${!signin? `
        <div class="field-label">Confirm password</div>
        <input class="field" id="authConfirm" type="password" placeholder="Re-enter your password">
      `:``}

      ${!signin? practitionerFields : ""}
      ${patientSubRolePicker}

      ${signin? `<p class="muted" style="margin-top:10px; text-align:right; cursor:pointer;" onclick="toast('Password reset link sent (demo)')">Forgot password?</p>`:""}

      <button class="btn btn-primary" style="margin-top:20px;" onclick="submitAuth()">${signin? 'Sign In' : 'Create Account'}</button>
      <p class="muted" style="text-align:center; margin-top:14px;">By continuing you agree to HealthAge's Terms &amp; Privacy Policy.</p>
    </div>
  `;
}

  `);
  let count = 10;
  const countdownEl = document.getElementById('emgCountdown');
  const tick = ()=>{
    if(countdownEl){ countdownEl.textContent = count; }
    count -= 1;

      if(countdownEl){ countdownEl.textContent = '0'; }

  const timer = setInterval(tick, 900);

    <div class="nav-item ${prState.tab===id?'active':''}" onclick="prApp.goTab('${id}')">${icon(ic)}<span>${label}</span></div>`).join("");
}
function renderProScreen(){
  const map = { home:prScreenHome, jobs:prScreenJobs, earnings:prScreenEarnings, profile:prScreenProfile };
  document.getElementById('screenBody').innerHTML = (map[prState.tab]||prScreenHome)();
  renderProNav();
}

    <p class="section-title" style="margin-top:18px;">Your day</p>
    <div class="card">
      <div class="visit-row">
        <div class="avatar">${icon('badge','style="width:20px;height:20px;stroke:var(--ha-forest)"')}</div>

    </div>
    <p class="section-title" style="margin-top:18px;">Upcoming jobs</p>
    ${prState.jobs.filter(j=>j.status!=='completed').map(j=>`
      <div class="card">
        <div class="visit-row">
          <div class="avatar">${j.patient.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>

function prScreenJobs(){
  const active = prState.jobs.filter(j=>j.status!=='completed');
  const done = PRDATA.completedToday;
  return `
    <p class="eyebrow" style="margin-top:8px;">Job flow</p>
    <p class="section-title">Active &amp; matched jobs</p>
    ${active.length? active.map(j=>`
      <div class="card">
        <div class="visit-row">
          <div class="avatar">${j.patient.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
          <div class="visit-info"><div class="visit-title">${j.patient}</div><div class="visit-sub">${j.service}</div><div class="visit-sub">${j.address} · ${j.time}</div></div>
          <span class="status-badge ${prStatusClass(j.status)}">${prStatusLabel(j.status)}</span>
        </div>
        <div class="btn-row">
          <button class="btn btn-outline btn-half" onclick="prApp.openJob(${j.id})">Details</button>
          <button class="btn btn-primary btn-half" onclick="prApp.advanceJob(${j.id})">${j.status==='matched'?'Navigate':j.status==='enroute'?'Arrived':'Start visit'}</button>
        </div>
      </div>
    `).join("") : `<div class="card muted">No active jobs — new requests will appear here.</div>`}
    <p class="section-title" style="margin-top:20px;">Completed today</p>
    <div class="card">${done.map((d,i)=>`<div class="earn-row" style="${i===done.length-1?'border-bottom:none;':''}"><span>${d.patient} · ${d.service}</span><b>${d.payout}</b></div>`).join("")}</div>
  `;
}

      <p class="greeting-sub">Total earned</p><p class="greeting-hi">${e.totalMonth}</p>

function prOpenJob(id){
  const j = prState.jobs.find(x=>x.id===id);
  openSheet(`
    <div class="sheet-handle"></div><div class="sheet-close" onclick="closeSheet()">✕</div>
    <p class="eyebrow">Job detail</p><p class="section-title">${j.patient}</p>
    <div class="card">
      <div class="earn-row"><span>Service</span><b>${j.service}</b></div>
      <div class="earn-row"><span>Address</span><b>${j.address}</b></div>
      <div class="earn-row"><span>Time window</span><b>${j.time}</b></div>
      <div class="earn-row"><span>Payout</span><b>${j.payout}</b></div>
    </div>
    <div class="map-mock">
      <svg viewBox="0 0 300 150"><polyline points="10,120 70,90 130,100 190,50 260,40" fill="none" stroke="#163832" stroke-width="2" stroke-dasharray="6 5"/></svg>
      <div class="map-pin" style="left:12px; top:112px; background:var(--ha-forest);"></div>
      <div class="map-pin" style="left:250px; top:32px;"></div>
    </div>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="prApp.advanceJob(${j.id}); closeSheet();">${j.status==='matched'?'Start navigation':j.status==='enroute'?'Mark as arrived':'Continue'}</button>
  `);
}
function prAdvanceJob(id){
  const j = prState.jobs.find(x=>x.id===id);
  if(j.status==='matched'){ j.status='enroute'; toast('Navigating to '+j.patient); renderProScreen(); return; }
  if(j.status==='enroute'){ j.status='inprogress'; toast('Arrived — starting visit'); renderProScreen(); prOpenDocumentation(id); return; }
  if(j.status==='inprogress'){ prOpenDocumentation(id); return; }
}
function prOpenDocumentation(id){
  const j = prState.jobs.find(x=>x.id===id);
  openSheet(`
    <div class="sheet-handle"></div><div class="sheet-close" onclick="closeSheet()">✕</div>
    <p class="eyebrow">Care recording</p><p class="section-title">${j.service}</p>
    <div class="field-label">Vitals</div>
    <div class="vital-grid">
      <input class="field" placeholder="Blood pressure" value="126/80">
      <input class="field" placeholder="Heart rate" value="74 bpm">
      <input class="field" placeholder="Temperature" value="36.7°C">
      <input class="field" placeholder="SpO₂" value="98%">
    </div>
    <div class="field-label">Treatment provided</div>
    <textarea class="field">Cleaned and redressed wound, checked for infection — none observed.</textarea>
    <div class="field-label">Notes for family &amp; follow-up</div>
    <textarea class="field">Healing on track. Recommend follow-up visit in 5 days.</textarea>
    <button class="btn btn-primary" style="margin-top:16px;" onclick="prApp.completeJob(${j.id})">${icon('check','style="width:16px;height:16px;stroke:white"')} Upload &amp; complete visit</button>
  `);
}
function prCompleteJob(id){
  const j = prState.jobs.find(x=>x.id===id);
  j.status='completed';
  prState.jobs = prState.jobs.filter(x=>x.id!==id);
  closeSheet();
  toast('Visit recorded — '+j.payout+' added to earnings');
  renderProScreen();
}
function prToggleDuty(){
  prState.duty = !prState.duty;
  renderProAppbar();
  toast(prState.duty? 'You are visible for new job matches' : 'You are now off duty');
  if(prState.duty){
    setTimeout(()=>{
      if(prState.duty && state.mode==='practitioner') openSheet(`
        <div class="sheet-handle"></div>
        <p class="eyebrow" style="text-align:center;">New request</p><p class="section-title" style="text-align:center;">Job incoming</p>
        <div class="card">
          <div class="visit-row">
            <div class="req-timer">12</div>
            <div class="visit-info"><div class="visit-title">${PRDATA.incoming.patient}, ${PRDATA.incoming.age}</div><div class="visit-sub">${PRDATA.incoming.service}</div><div class="visit-sub">${PRDATA.incoming.distance} · ${PRDATA.incoming.window}</div></div>
            <div class="eta-badge">${PRDATA.incoming.payout}</div>
          </div>
          <p class="muted" style="margin-top:8px;">${PRDATA.incoming.notes}</p>
        </div>
        <div class="btn-row"><button class="btn btn-outline btn-half" onclick="closeSheet()">Decline</button><button class="btn btn-primary btn-half" onclick="prApp.acceptIncoming()">Accept</button></div>
      `);
    }, 1400);
  }
}
function prAcceptIncoming(){
  const newId = Math.max(0,...prState.jobs.map(j=>j.id))+1;
  prState.jobs.unshift({ id:newId, patient:PRDATA.incoming.patient, service:PRDATA.incoming.service, time:PRDATA.incoming.window.split(', ')[1]||PRDATA.incoming.window, address:PRDATA.incoming.address, payout:PRDATA.incoming.payout, status:'matched' });
  closeSheet();
  toast('Job accepted — added to your list');
  prState.tab='jobs'; renderProScreen();
}

const prApp = {
  goTab(id){ prState.tab=id; renderProScreen(); },
  toggleDuty: prToggleDuty, openJob: prOpenJob, advanceJob: prAdvanceJob, completeJob: prCompleteJob, acceptIncoming: prAcceptIncoming
};

/* ================================================================
   CLOCK + BOOT
   ================================================================ */
function tickClock(){ const d=new Date(); document.getElementById('clockTime').textContent = d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
tickClock(); setInterval(tickClock, 30000);

render();
</script>
</body>
